<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KCSI 비식별화 미리보기 검증</title>
  <link rel="stylesheet" href="deidentify.css">
  <style>
    body{margin:0;background:#f5f5f4;font-family:Arial,'Noto Sans KR',sans-serif;color:#18181b}
    main{max-width:520px;margin:0 auto;padding:24px 18px}
    button{border:0;border-radius:10px;background:#18181b;color:#fff;padding:13px 16px;font-size:14px;font-weight:700}
    #result{margin-top:16px;line-height:1.6;font-size:13px}
    #result img{display:block;width:100%;margin-top:12px;border:1px solid #d6d3d1;border-radius:10px}
  </style>
</head>
<body>
<main>
  <h1>비식별화 미리보기 검증</h1>
  <p>실제 개인정보가 아닌 합성 문서로 브라우저 로컬 OCR과 검토 화면을 확인합니다.</p>
  <button id="start" type="button">합성 의료기록 비식별화 시작</button>
  <div id="result" role="status">대기 중</div>
</main>

<div class="deid-modal" id="deidModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="deidTitle">
  <div class="deid-shell">
    <div class="deid-head"><div><div class="deid-title" id="deidTitle">비식별화 준비</div><div class="deid-sub" id="deidSub"></div></div><button class="deid-cancel" id="deidCancel" type="button">취소</button></div>
    <div class="deid-stage"><canvas class="deid-canvas" id="deidCanvas" width="1" height="1"></canvas><div class="deid-loading" id="deidLoading">준비 중</div></div>
    <div class="deid-panel">
      <div class="deid-summary" id="deidSummary"></div>
      <div class="deid-tools"><button class="deid-tool on" id="deidDraw" type="button">손가락으로 추가</button><button class="deid-tool" id="deidErase" type="button">상자 탭해 삭제</button><button class="deid-tool" id="deidUndo" type="button">직전 추가 취소</button></div>
      <div class="deid-help" id="deidHelp"></div>
      <label class="deid-check"><input type="checkbox" id="deidConfirm"><span>합성 문서의 개인 식별 정보가 보이지 않는 것을 확인했습니다.</span></label>
      <div class="deid-actions"><button class="deid-skip" id="deidSkip" type="button">등록하지 않기</button><button class="deid-apply" id="deidApply" type="button" disabled>비식별화 사본 사용</button></div>
    </div>
  </div>
</div>

<script src="deidentify.js"></script>
<script>
document.getElementById('start').addEventListener('click', async () => {
  const button = document.getElementById('start');
  const status = document.getElementById('result');
  button.disabled = true; status.textContent = '브라우저 로컬 처리 시작';
  const canvas = document.createElement('canvas'); canvas.width = 1200; canvas.height = 1500;
  const c = canvas.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0,0,canvas.width,canvas.height);
  c.fillStyle = '#111'; c.font = '700 48px Arial, sans-serif'; c.fillText('처 방 전', 70, 100);
  c.font = '34px Arial, sans-serif';
  ['환자명 홍길동','주민등록번호 860813-1234567','생년월일 1986-08-13','연락처 010-1234-5678','환자번호 PT-20260813','주소 서울특별시 마포구 월드컵로 123','', '약품명 타이레놀정 500mg','용법 1일 3회 3일분'].forEach((line,i)=>c.fillText(line,70,200+i*105));
  try {
    const [result] = await KCSI_DEID.processDataUrls([canvas.toDataURL('image/png')], {
      onProgress: text => { status.textContent = text; },
      onWords: words => {
        window.__deidSyntheticWords = words;
        status.textContent = `OCR: ${words.map(word => word.text).join(' | ')}`;
      },
    });
    status.innerHTML = `<b id="pass">PASS · 비식별화 사본 생성</b><br>가림 상자 ${result.maskCount}개<img alt="비식별화 결과" src="${result.dataUrl}">`;
  } catch (error) { status.textContent = error.message; }
  button.disabled = false;
});
</script>
</body>
</html>
